<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartGadget — Wholesale Gadgets, Factory Direct (Demo)</title>
    <meta
      name="description"
      content="SmartGadget supplies phones, audio, wearables and accessories at wholesale tiers. Live stock, volume pricing, ships in 48 hours across Bangladesh."
    />
    <meta name="theme-color" content="#0A101E" />
    <link rel="icon" type="image/svg+xml" href="./brand/logo-mark.svg" />
    <meta property="og:title" content="SmartGadget — Premium Tech Marketplace" />
    <meta property="og:description" content="Wholesale gadgets, priced by the carton. Live inventory and tiered pricing." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./brand/banner.svg" />
    <!-- A demonstration build with invented data. Kept out of search results so
         it can never outrank, or be mistaken for, a real shop. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Every tag on this page reports to the agency's own properties. The
         demo_site flag is pushed first so GTM, GA4 and any tag inside the
         container can tell this demonstration traffic apart from the real
         site's. See src/lib/tracking-config.ts. -->
    <script>window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ demo_site: 'smartgadget-demo' });</script>

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-WN9DK67S');</script>
    <!-- End Google Tag Manager -->

    <!-- Google tag (gtag.js) — GA4 e-commerce events; see src/lib/analytics.ts -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HY9255GJYE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // send_page_view is off because this is a single-page app: the router
      // reports every screen itself (see src/lib/analytics.ts), including the
      // first one. Leaving it on would double-count the landing page.
      // Every event from this build carries demo_site, so the demonstration
      // shop's invented orders can be filtered out of the reports that real
      // ad spend is judged on.
      gtag('set', { demo_site: 'smartgadget-demo' });
      gtag('config', 'G-HY9255GJYE', { send_page_view: false });
    </script>

    <!-- Meta Pixel. PageView only: this build never fires a standard conversion
         event, because invented purchases would train the agency's real ad
         delivery on traffic that can never buy anything. See analytics.ts. -->
    <script>
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,
      'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1612338809888151');
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WN9DK67S"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1612338809888151&ev=PageView&noscript=1" /></noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
