<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Veloura Atelier · Admin Login</title>
  
  <style>
    /* Premium Login Page Styles */
    :root {
      --bg-color: #F4F7FE;
      --surface: #FFFFFF;
      --primary: #4318FF;
      --primary-hover: #3311DB;
      --text-main: #2B3674;
      --text-muted: #A3AED0;
      --border: #E0E5F2;
      --line: #E0E5F2;
    }

    body {
      background: var(--bg-color);
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: var(--text-main);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0px 4px 24px rgba(112, 144, 176, 0.08);
      border: 1px solid var(--border);
    }

    .eyebrow {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .stack-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .stack-form label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .stack-form input {
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-color);
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .stack-form input:focus {
      border-color: var(--primary);
      background: #FFFFFF;
    }

    .button-dark {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
      margin-top: 8px;
      width: 100%;
    }

    .button-dark:hover {
      background: var(--primary-hover);
    }

    .demo-notice {
      background: #EEF2FF;
      border: 1px solid #C7D2FE;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: -4px;
      margin-bottom: 8px;
    }

    .demo-notice p {
      margin: 0;
      font-size: 13px;
      color: var(--primary);
      line-height: 1.5;
    }

    .demo-notice strong {
      color: #312E81;
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--text-main);
    }

  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <span class="eyebrow">VELOURA ATELIER · ADMIN</span>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to manage your premium store, inventory, and operations.</p>
      
      <form class="stack-form" id="login-form">
        <label>
          ইউজারনেম (Username)
          <input id="login-username" autocomplete="username" placeholder="Enter username" required />
        </label>
        
        <label>
          পাসওয়ার্ড (Password)
          <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </label>

        <div class="demo-notice">
          <p>👉 ডেমো দেখার জন্য Username: <strong>admin</strong> এবং Password: <strong>demo123</strong> টাইপ করুন।</p>
        </div>

        <button class="button-dark" type="submit">Sign in <span>→</span></button>
      </form>
    </div>
    
    <div style="text-align: center;">
      <a href="../index.html" class="back-link">← Back to Storefront</a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('login-username').value.trim().toLowerCase();
      const pass = document.getElementById('login-password').value.trim();
      
      if(user === 'admin' && pass === 'demo123') {
        // ডেমো ক্রেডেনশিয়াল ঠিক থাকলে static demo session রেখে dashboard-এ যাবে
        sessionStorage.setItem('veloura-admin-token', 'static-demo-token');
        sessionStorage.setItem('veloura-admin-demo-mode', '1');
        window.location.href = './admin/index.html'; 
      } else {
        alert('ভুল ইউজারনেম বা পাসওয়ার্ড! ডেমোর জন্য admin এবং demo123 ব্যবহার করুন।');
      }
    });
  </script>

</body>
</html>
