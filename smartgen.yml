site_name: Veloura Atelier Demo
site_url: https://bayzed123.github.io/websites-tamplate/veloura-atelier-demo/web/
site_author: Sayad Md Bayezid Hosan & SmartGen Platform
site_description: Veloura Atelier E-commerce Storefront and Admin Dashboard Demo
repo_name: GitHub
edit_uri: edit/main/

theme:
  name: apiplay
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - header.autohide
  
  # সকল CSS এবং JS ফাইল পাইপলাইনে যুক্ত করার জন্য
  extra_css:
    - styles.css
    - theme.css
    - admin/styles.css

  extra_javascript:
    - app.js
    - checkout.js
    - account.js
    - blog.js
    - invoice.js
    - product.js
    - mobile-nav.js
    - site-chat.js
    - theme-init.js
    - hero-carousel.js
    - icons.js
    - media-viewer.js
    - admin/app.js
    - admin/premium-ui.js
    - admin/steadfast.js

# ফোল্ডার ও ফাইল পাথ অনুযায়ী সম্পূর্ণ নেভিগেশন ম্যাপ
nav:
  - Storefront:
      - Home: index.html
      - Product Page: product.html
      - Checkout Page: checkout.html
  - Customer Hub:
      - Account: account.html
      - Invoice: invoice.html
      - Order Tracking: track.html
  - Content & Support:
      - Blog: blog.html
      - Sitemap: sitemap.html
      - Error Page: 404.html
  - Admin Studio:
      - Admin Dashboard: admin/index.html

extra:
  powered_by_name: SmartGen Platform
  product_url: https://smartgentools.com
  dashboard_url: https://leads.sayadbayezid.com/
  founder_url: https://sayadbayezid.com
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bayzed123
    - icon: fontawesome/solid/globe
      link: https://smartgentools.com