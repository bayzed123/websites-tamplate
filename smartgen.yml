site_name: Client Demo Hub
site_url: https://demu.sayadbayezid.com
site_author: Sayad Md Bayezid Hosan
site_description: A root-based client demo hub for storefronts, admin dashboards, and frontend tools.
repo_name: bayzed123/websites-tamplate
repo_url: https://github.com/bayzed123/websites-tamplate
edit_uri: edit/main/

theme:
  name: default
  palette:
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top

# SmartGen navigation is intentionally small and stable. The live client catalog
# is generated by scripts/build-demo-hub.mjs, which discovers every project folder
# containing an index.html file and preserves all supported asset/file types.
nav:
  - Demo Hub: index.md
  - Adding a Demo: adding-a-demo.md
  - Deployment: deployment.md

extra:
  powered_by_name: SmartGen Platform
  product_url: https://smartgentools.com
  founder_url: https://sayadbayezid.com
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bayzed123
    - icon: fontawesome/solid/globe
      link: https://smartgentools.com
