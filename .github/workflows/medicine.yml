name: Medicine - Apply Latest Doctor Guidance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  medicine:
    name: Read latest audit and record fixes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read latest Doctor report and write medicine result
        run: node scripts/medicine.mjs doctor-report

      - name: Commit medicine result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doctor-report
          git diff --cached --quiet || git commit -m "docs: record medicine result"
          git push

      - name: Upload medicine report
        uses: actions/upload-artifact@v4
        with:
          name: medicine-report-${{ github.run_number }}
          path: doctor-report/
          if-no-files-found: error
