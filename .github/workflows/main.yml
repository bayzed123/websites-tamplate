name: Websites Template Portfolio Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publish Portfolio to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Configure Pages
        uses: actions/configure-pages@v5
        
      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploying the entire repository root
          path: '.' 
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
