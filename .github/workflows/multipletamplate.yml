name: Build and Deploy Client Demo Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Discover and build demos
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build root demo hub
        run: node scripts/build-demo-hub.mjs site

      - name: Validate generated artifact
        shell: bash
        run: |
          test -s site/index.html
          test -s site/demos/index.html
          test -s site/demos/manifest.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('site/demos/manifest.json', 'utf8'));
          if (!Array.isArray(manifest)) throw new Error('Demo manifest is not an array');
          for (const demo of manifest) {
            if (!demo.slug || !demo.entryFile) throw new Error(`Invalid demo entry: ${JSON.stringify(demo)}`);
          }
          console.log(`Validated ${manifest.length} demo project(s).`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
