name: Build and Deploy Client Demo Hub

on:
  push:
    branches:
      - main
  # Every red deploy so far was discovered on main, after the fact, because
  # nothing ran these checks before a merge. Pull requests build and run the
  # full check suite; only the deploy job is skipped for them.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A pull request check must never cancel a deploy that is mid-flight, so PRs
  # get their own group, one per branch.
  group: ${{ github.event_name == 'pull_request' && format('demo-hub-pr-{0}', github.head_ref) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build:
    name: Discover and build demos
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install preview test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build the SmartGadget demo
        # A Vite project, unlike every other demo here — it has to be built
        # before the hub goes looking for an index.html to publish.
        run: npm ci --prefix smartgadget-demo/web && npm run build --prefix smartgadget-demo/web

      - name: Build the Sidra Clothing demo
        # A Vite project like SmartGadget — built here so the hub has a dist/
        # to publish rather than the source entry.
        run: npm ci --prefix sidra-clothing && npm run build --prefix sidra-clothing

      - name: Build the Sidra Noor Fashion demo
        # Vue CLI 4.5 predates modern Node and npm's strict peer resolution, so
        # this one needs both escape hatches. Cypress is skipped because its
        # postinstall downloads a binary this build never runs.
        env:
          CYPRESS_INSTALL_BINARY: '0'
          NODE_OPTIONS: '--openssl-legacy-provider'
        run: |
          cd sidra-noor-fashion/client
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Check the demo leaks nothing from the live store
        run: node tests/demo-isolation.mjs

      - name: Build root demo hub
        run: node scripts/build-demo-hub.mjs site

      - name: Capture demo thumbnails
        run: node scripts/capture-thumbnails.mjs site

      - name: Check every demo on desktop and mobile
        run: node tests/live-preview.mjs site

      - name: Check every admin is reachable from the hub
        # Four dashboards were live and unreachable from the grid. This walks
        # the path a visitor takes: card link, then what the link opens.
        run: node tests/hub-admin-links.mjs site

      - name: Check the hub measures nobody without permission
        run: node tests/hub-tracking.mjs site

      - name: Check the Bootstrap Fashion demo is completable
        run: node tests/bootstrap-fashion.mjs site

      - name: Check the Bootstrap Fashion admin agrees with the shop
        # dist/ is committed for this template, so the admin is checked against
        # the committed output the hub actually publishes.
        run: node tests/bootstrap-fashion-admin.mjs bootstrap-fashion/dist

      - name: Check the Sidra Clothing demo works with no server
        run: node tests/sidra-clothing.mjs sidra-clothing/dist

      - name: Check the Sidra Clothing admin agrees with the shop
        run: node tests/sidra-clothing-admin.mjs sidra-clothing/dist

      - name: Check the Sidra Noor shop and admin both work
        run: node tests/sidra-noor-fashion.mjs sidra-noor-fashion/client/dist

      - name: Check the SmartGadget admin agrees with itself
        # A screen that renders "0 orders" passes a does-it-render check. This
        # one compares the list screens against the dashboard's own totals.
        run: node tests/smartgadget-admin.mjs smartgadget-demo/web/dist

      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-demo-preview-screenshots
          path: artifacts/playwright/
          if-no-files-found: ignore

      - name: Validate generated artifact
        shell: bash
        run: |
          test -s site/index.html
          test -s site/sitemap.xml
          test -s site/robots.txt
          test -s site/demos/manifest.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('site/demos/manifest.json', 'utf8'));
          if (!Array.isArray(manifest)) throw new Error('Demo manifest is not an array');
          for (const demo of manifest) {
            if (!demo.slug || !demo.entryFile) throw new Error(`Invalid demo entry: ${JSON.stringify(demo)}`);
          }
          // The artifact is public and indexed: fail the build rather than
          // publish backend source, migrations or internal notes.
          const { execSync } = await import('node:child_process');
          const leaked = execSync(
            "find site -type f \\( -name '*.md' -o -name '*.sql' -o -name '*.ts' -o -name 'package*.json' -o -name '*.toml' -o -name '*.example' \\) -o -type d \\( -name worker -o -name migrations -o -name node_modules \\)",
            { encoding: 'utf8' },
          ).trim();
          if (leaked) throw new Error(`Internal files reached the public artifact:\n${leaked}`);
          console.log(`Validated ${manifest.length} demo project(s).`);
          NODE

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # A pull request proves the build; it does not publish it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
