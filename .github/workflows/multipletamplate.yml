name: Build and Deploy Client Demo Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Discover and build demos
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install preview test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build root demo hub
        run: node scripts/build-demo-hub.mjs site

      - name: Capture demo thumbnails
        run: node scripts/capture-thumbnails.mjs site

      - name: Check every demo on desktop and mobile
        run: node tests/live-preview.mjs site

      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-demo-preview-screenshots
          path: artifacts/playwright/
          if-no-files-found: ignore

      - name: Validate generated artifact
        shell: bash
        run: |
          test -s site/index.html
          test -s site/sitemap.xml
          test -s site/robots.txt
          test -s site/demos/manifest.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('site/demos/manifest.json', 'utf8'));
          if (!Array.isArray(manifest)) throw new Error('Demo manifest is not an array');
          for (const demo of manifest) {
            if (!demo.slug || !demo.entryFile) throw new Error(`Invalid demo entry: ${JSON.stringify(demo)}`);
          }
          // The artifact is public and indexed: fail the build rather than
          // publish backend source, migrations or internal notes.
          const { execSync } = await import('node:child_process');
          const leaked = execSync(
            "find site -type f \\( -name '*.md' -o -name '*.sql' -o -name '*.ts' -o -name 'package*.json' -o -name '*.toml' -o -name '*.example' \\) -o -type d \\( -name worker -o -name migrations -o -name node_modules \\)",
            { encoding: 'utf8' },
          ).trim();
          if (leaked) throw new Error(`Internal files reached the public artifact:\n${leaked}`);
          console.log(`Validated ${manifest.length} demo project(s).`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
